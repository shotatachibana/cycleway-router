  # 挟むようになったため、OSM由来の中間ファイルに変更した(2026-09-22)。
  # 最終成果物の生成は src/network_merge/build_priority_network.py が行う。
  cycleway_geojson: "data/interim/cycleway_network_osm.geojson"
  reference_geojson: "docs/data/reference_infrastructure.geojson"
  routes_dir: "docs/data/routes"
  routes_index: "docs/data/routes/index.json"
  attribution: "docs/data/attribution.json"

coordinate_precision_digits: 6
cycleway_buffer_m: 15
metric_crs: "EPSG:32654"
