input:
  cycleway_raw: "data/raw/osm_survey/kanto_independent_cycleway.json"
  separated_track_raw: "data/raw/osm_survey/kanto_separated_track.json"
  painted_lane_raw: "data/raw/osm_survey/kanto_painted_lane.json"
  shared_lane_raw: "data/raw/osm_survey/kanto_shared_lane.json"

output:
